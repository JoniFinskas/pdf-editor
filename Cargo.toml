[workspace]
members = ["core", "app"]
resolver = "3"

# Single source of the project version; see VERSIONING.md.
[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

# Reduce the portable Windows executable without disabling error recovery.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
