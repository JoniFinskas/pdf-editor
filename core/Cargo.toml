[package]
name = "pdf-editor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless PDF text editing engine"

[lib]
path = "lib.rs"

[[bin]]
name = "corpus-runner"
path = "bin/corpus-runner.rs"

[dependencies]
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
skrifa = "=0.48.0"
lopdf = { version = "=0.45.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT", "Win32_Globalization", "Win32_System_Com"] }
