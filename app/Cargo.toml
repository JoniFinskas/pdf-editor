[package]
name = "pdf-editor"
default-run = "pdf-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Desktop PDF editor that edits existing text in place"

[[bin]]
name = "pdf-editor"
path = "src/main.rs"

[dependencies]
pdf-editor-core = { path = "../core" }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "glow"] }
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
# The native acceptance harness needs the platform extension of the same winit
# already used by eframe. No additional runtime dependency or features.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
[[bin]]
name = "pdf-editor-cli"
path = "src/cli_main.rs"
